name: Morning swing scan

on:
  schedule:
    # 01:17 UTC = 06:47 IST, Monday-Friday. Off-peak minute (avoids the
    # :00/:30 congestion) with extra buffer, since GitHub schedule triggers
    # are best-effort and have been observed running hours late.
    - cron: "17 1 * * 1-5"
  workflow_dispatch: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run screener (NIFTY 500, holiday-aware, Telegram report)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python screener.py --auto --universe nifty500

      - name: Upload results CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-results
          path: results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Telegram alert if the scan failed
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            curl -s "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
              -d chat_id="$TELEGRAM_CHAT_ID" \
              -d text="⚠️ Swing screener FAILED this morning - check the GitHub Actions log."
          fi
